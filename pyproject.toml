[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-particle-sliders"
version = "0.1.0"
description = "Native Iris-3B routed particle concept sliders for HyperGAN"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "torch>=2.7.1,<3", "safetensors>=0.4", "numpy>=1.26", "pillow>=10",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@20fdf98d25455582e7e7191eef8ef51cf73173ae#subdirectory=packages/particle-sliders-core",
  "iris-3b @ git+https://github.com/speridlabs/iris-3b.git@a8d15239dea469aba042cfa56ca3bb4e450d5ebc",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8", "build>=1"]

[project.scripts]
iris-slider-train = "iris_sliders.train:main"
iris-slider-infer = "iris_sliders.infer:main"
iris-slider-card = "iris_sliders.card:main"

[project.urls]
Repository = "https://github.com/HyperGAN/iris-particle-sliders"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_sliders = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
