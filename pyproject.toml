[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-particle-sliders"
version = "0.2.0"
description = "Native Iris-3B routed particle concept sliders for HyperGAN"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "torch>=2.7.1,<3", "safetensors>=0.4", "numpy>=1.26", "pillow>=10",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@cb0e6c39a51d451fa6ed5e72169b66e12ac247d1#subdirectory=packages/particle-sliders-core",
  "iris-3b @ git+https://github.com/speridlabs/iris-3b.git@a8d15239dea469aba042cfa56ca3bb4e450d5ebc",
]

[project.optional-dependencies]
hndl = ["hndl==0.8.2"]
diagnostics = ["hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@a879c4fbff903ccefeba2194bcc7a13fe7b5abb7"]
dev = ["pytest>=8,<10", "ruff>=0.8", "build>=1"]

[project.scripts]
iris-slider-train = "iris_sliders.train:main"
iris-slider-train-legacy = "iris_sliders.legacy_train:main"
iris-slider-response = "iris_sliders.response:main"
iris-slider-infer = "iris_sliders.infer:main"
iris-slider-card = "iris_sliders.card:main"

[project.urls]
Repository = "https://github.com/HyperGAN/iris-particle-sliders"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_sliders = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[project.entry-points."particle_sliders.image_backends"]
iris = "iris_sliders.lifecycle:BACKEND"
